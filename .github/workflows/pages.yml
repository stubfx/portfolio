name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      # Interim: until build.mjs exists, the site is the prototype (one self-contained
      # HTML file, fonts embedded, no external requests). When the real build lands,
      # replace this step with the steps in docs/BUILD.md section 14.
      - name: Assemble the site from the prototype
        run: |
          mkdir -p dist
          cp prototype/index.html dist/index.html
          cp prototype/index.html dist/404.html
          cp -r static/. dist/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
